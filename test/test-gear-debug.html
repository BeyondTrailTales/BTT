<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Debug Test</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Gear Page Debug Test</h1>
    <p>Open your browser console to see the debug output.</p>
    <div id="result"></div>

    <script>
    // Test if jQuery loads
    console.log("jQuery loaded:", typeof jQuery !== 'undefined');
    
    // Test API call
    if (typeof jQuery !== 'undefined') {
        console.log("Making API request to gear endpoint...");
        
        $.ajax({
            url: 'http://localhost/BTT/api/?route=gear',
            method: 'GET',
            dataType: 'json',
            success: function(response) {
                console.log("API Response:", response);
                if (response.success && response.data && response.data.items) {
                    $('#result').html('<p style="color: green;">✅ API working! Found ' + response.data.items.length + ' gear items.</p>');
                    console.log("Number of items:", response.data.items.length);
                } else {
                    $('#result').html('<p style="color: red;">❌ API returned unexpected format.</p>');
                }
            },
            error: function(xhr, status, error) {
                console.error("API Error:", error);
                $('#result').html('<p style="color: red;">❌ API request failed: ' + error + '</p>');
            }
        });
    } else {
        $('#result').html('<p style="color: red;">❌ jQuery not loaded!</p>');
    }
    </script>
</body>
</html>
