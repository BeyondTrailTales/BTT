<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trips API Test Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #0a0e1a;
            color: #e2e8f0;
        }
        h1 { color: #4ade80; }
        .test-section {
            background: #1a1f2e;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            background: #4ade80;
            color: #0a0e1a;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        button:hover { background: #22c55e; }
        .result {
            background: #0f1419;
            border: 1px solid #2d3748;
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .success { border-color: #4ade80; }
        .error { border-color: #ef4444; }
        .info { color: #60a5fa; }
        .warning { color: #fbbf24; }
        input, textarea, select {
            background: #0f1419;
            border: 1px solid #2d3748;
            color: #e2e8f0;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            margin: 5px 0;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #94a3b8;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>
    <h1>🏔️ BTT Trips API Test Page</h1>
    
    <div class="test-section">
        <h2>Authentication Status</h2>
        <button onclick="checkAuth()">Check Authentication</button>
        <div id="auth-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>List Trips</h2>
        <button onclick="listTrips()">Get All Trips</button>
        <div id="list-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Create Trip</h2>
        <form id="create-form" onsubmit="createTrip(event)">
            <div class="form-row">
                <div>
                    <label>Trip Title *</label>
                    <input type="text" name="title" required placeholder="My Amazing Trip">
                </div>
                <div>
                    <label>Location</label>
                    <input type="text" name="location" placeholder="Yosemite National Park">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Start Date</label>
                    <input type="date" name="start_date">
                </div>
                <div>
                    <label>End Date</label>
                    <input type="date" name="end_date">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Distance</label>
                    <input type="number" name="distance" step="0.1" placeholder="10.5">
                </div>
                <div>
                    <label>Difficulty</label>
                    <select name="difficulty">
                        <option value="">Select...</option>
                        <option value="easy">Easy</option>
                        <option value="moderate">Moderate</option>
                        <option value="hard">Hard</option>
                        <option value="expert">Expert</option>
                    </select>
                </div>
            </div>
            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Trip notes..."></textarea>
            <div class="form-row">
                <div>
                    <label>
                        <input type="checkbox" name="favorite" value="1"> Favorite
                    </label>
                </div>
                <div>
                    <label>
                        <input type="checkbox" name="completed" value="1"> Completed
                    </label>
                </div>
            </div>
            <button type="submit">Create Trip</button>
        </form>
        <div id="create-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Update/Delete Trip</h2>
        <div class="form-row">
            <input type="number" id="trip-id" placeholder="Trip ID">
            <div>
                <button onclick="getTrip()">Get Trip</button>
                <button onclick="updateTrip()">Update Trip</button>
                <button onclick="deleteTrip()">Delete Trip</button>
            </div>
        </div>
        <div id="trip-result" class="result"></div>
    </div>

    <script>
        const API_BASE = '/BTT/api/index.php';
        
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            element.className = 'result ' + className;
            element.textContent = `[${timestamp}] ${message}`;
        }
        
        async function makeRequest(route, method = 'GET', body = null) {
            const url = `${API_BASE}?route=${route}`;
            const options = {
                method: method === 'DELETE' || method === 'PUT' ? 'POST' : method,
                credentials: 'include', // Include cookies
                headers: {
                    'Accept': 'application/json'
                }
            };
            
            if (body) {
                const formData = new FormData();
                if (method === 'PUT') formData.append('_method', 'PUT');
                if (method === 'DELETE') formData.append('_method', 'DELETE');
                
                Object.keys(body).forEach(key => {
                    if (body[key] !== null && body[key] !== undefined && body[key] !== '') {
                        formData.append(key, body[key]);
                    }
                });
                options.body = formData;
            }
            
            const response = await fetch(url, options);
            const text = await response.text();
            
            try {
                return { 
                    status: response.status, 
                    data: JSON.parse(text) 
                };
            } catch {
                return { 
                    status: response.status, 
                    data: text 
                };
            }
        }
        
        async function checkAuth() {
            log('auth-result', 'Checking authentication...');
            try {
                // Try to get trips - if we get 401, we're not authenticated
                const result = await makeRequest('trips');
                if (result.status === 401) {
                    log('auth-result', 'Not authenticated. Please login at /BTT/login.php', 'error');
                } else if (result.status === 200) {
                    log('auth-result', '✅ Authenticated! Session is active.\n' + JSON.stringify(result.data, null, 2), 'success');
                } else {
                    log('auth-result', 'Unexpected status: ' + result.status + '\n' + JSON.stringify(result.data, null, 2));
                }
            } catch (error) {
                log('auth-result', 'Error: ' + error.message, 'error');
            }
        }
        
        async function listTrips() {
            log('list-result', 'Loading trips...');
            try {
                const result = await makeRequest('trips');
                if (result.status === 401) {
                    log('list-result', 'Not authenticated. Please login first.', 'error');
                } else if (result.status === 200) {
                    const trips = result.data.data || [];
                    log('list-result', `Found ${trips.length} trips:\n` + JSON.stringify(trips, null, 2), 'success');
                } else {
                    log('list-result', 'Error: ' + JSON.stringify(result.data, null, 2), 'error');
                }
            } catch (error) {
                log('list-result', 'Error: ' + error.message, 'error');
            }
        }
        
        async function createTrip(event) {
            event.preventDefault();
            log('create-result', 'Creating trip...');
            
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData);
            
            try {
                const result = await makeRequest('trips', 'POST', data);
                if (result.status === 401) {
                    log('create-result', 'Not authenticated. Please login first.', 'error');
                } else if (result.status === 200 || result.status === 201) {
                    log('create-result', '✅ Trip created successfully!\n' + JSON.stringify(result.data, null, 2), 'success');
                    event.target.reset();
                } else {
                    log('create-result', 'Error: ' + JSON.stringify(result.data, null, 2), 'error');
                }
            } catch (error) {
                log('create-result', 'Error: ' + error.message, 'error');
            }
        }
        
        async function getTrip() {
            const id = document.getElementById('trip-id').value;
            if (!id) {
                log('trip-result', 'Please enter a trip ID', 'error');
                return;
            }
            
            log('trip-result', 'Loading trip...');
            try {
                const result = await makeRequest(`trips&id=${id}`);
                if (result.status === 404) {
                    log('trip-result', 'Trip not found or not owned by you', 'error');
                } else if (result.status === 200) {
                    log('trip-result', 'Trip data:\n' + JSON.stringify(result.data, null, 2), 'success');
                } else {
                    log('trip-result', 'Error: ' + JSON.stringify(result.data, null, 2), 'error');
                }
            } catch (error) {
                log('trip-result', 'Error: ' + error.message, 'error');
            }
        }
        
        async function updateTrip() {
            const id = document.getElementById('trip-id').value;
            if (!id) {
                log('trip-result', 'Please enter a trip ID', 'error');
                return;
            }
            
            const updates = {
                title: prompt('New title (or cancel to skip):'),
                location: prompt('New location (or cancel to skip):')
            };
            
            // Remove null/empty values
            Object.keys(updates).forEach(key => {
                if (!updates[key]) delete updates[key];
            });
            
            if (Object.keys(updates).length === 0) {
                log('trip-result', 'No updates provided', 'error');
                return;
            }
            
            log('trip-result', 'Updating trip...');
            try {
                const result = await makeRequest(`trips&id=${id}`, 'PUT', updates);
                if (result.status === 404) {
                    log('trip-result', 'Trip not found or not owned by you', 'error');
                } else if (result.status === 200) {
                    log('trip-result', '✅ Trip updated successfully!\n' + JSON.stringify(result.data, null, 2), 'success');
                } else {
                    log('trip-result', 'Error: ' + JSON.stringify(result.data, null, 2), 'error');
                }
            } catch (error) {
                log('trip-result', 'Error: ' + error.message, 'error');
            }
        }
        
        async function deleteTrip() {
            const id = document.getElementById('trip-id').value;
            if (!id) {
                log('trip-result', 'Please enter a trip ID', 'error');
                return;
            }
            
            if (!confirm('Are you sure you want to delete this trip?')) {
                return;
            }
            
            log('trip-result', 'Deleting trip...');
            try {
                const result = await makeRequest(`trips&id=${id}`, 'DELETE');
                if (result.status === 404) {
                    log('trip-result', 'Trip not found or not owned by you', 'error');
                } else if (result.status === 200) {
                    log('trip-result', '✅ Trip deleted successfully!', 'success');
                    document.getElementById('trip-id').value = '';
                } else {
                    log('trip-result', 'Error: ' + JSON.stringify(result.data, null, 2), 'error');
                }
            } catch (error) {
                log('trip-result', 'Error: ' + error.message, 'error');
            }
        }
        
        // Check auth on load
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
