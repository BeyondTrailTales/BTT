<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Trips Page - BTT</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #0f0;
            padding: 20px;
        }
        .test {
            background: #000;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #0f0;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
        button {
            background: #0f0;
            color: #000;
            padding: 10px 20px;
            border: none;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #111;
            padding: 10px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <h1>BTT Trips Page Diagnostics</h1>
    
    <div class="test">
        <h2>1. Check JavaScript Loading</h2>
        <div id="js-check"></div>
    </div>
    
    <div class="test">
        <h2>2. Check API Connection</h2>
        <button onclick="checkAPI()">Test API Connection</button>
        <div id="api-result"></div>
    </div>
    
    <div class="test">
        <h2>3. Check Trips Data</h2>
        <button onclick="fetchTrips()">Fetch Trips</button>
        <div id="trips-result"></div>
    </div>
    
    <div class="test">
        <h2>4. Console Errors</h2>
        <p>Open browser console (F12) to check for JavaScript errors</p>
        <button onclick="window.location.href='/BTT/trips.php'">Go to Trips Page</button>
    </div>

    <script src="/BTT/vendor/jquery-3.7.1.min.js"></script>
    <script src="/BTT/assets/js/app.js"></script>
    
    <script>
        // Check if JavaScript is loading
        document.addEventListener('DOMContentLoaded', function() {
            const jsCheck = document.getElementById('js-check');
            
            let results = [];
            
            // Check jQuery
            if (typeof $ !== 'undefined') {
                results.push('<span class="success">✓ jQuery loaded</span>');
            } else {
                results.push('<span class="error">✗ jQuery not loaded</span>');
            }
            
            // Check BTT globals
            if (typeof window.BTT !== 'undefined') {
                results.push('<span class="success">✓ BTT config loaded</span>');
                results.push(`<small>API URL: ${window.BTT?.apiUrl || 'undefined'}</small>`);
            } else {
                results.push('<span class="error">✗ BTT config not loaded</span>');
            }
            
            // Check BTTApi
            if (typeof window.BTTApi !== 'undefined') {
                results.push('<span class="success">✓ BTTApi loaded</span>');
            } else {
                results.push('<span class="error">✗ BTTApi not loaded</span>');
            }
            
            // Check BTTUtils
            if (typeof window.BTTUtils !== 'undefined') {
                results.push('<span class="success">✓ BTTUtils loaded</span>');
            } else {
                results.push('<span class="error">✗ BTTUtils not loaded</span>');
            }
            
            jsCheck.innerHTML = results.join('<br>');
        });
        
        // Set BTT config if not already set
        if (!window.BTT) {
            window.BTT = {
                apiUrl: '/BTT/api',
                baseUrl: '/BTT'
            };
        }
        
        async function checkAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/BTT/api?route=trips', {
                    credentials: 'include'
                });
                
                const text = await response.text();
                let data;
                
                try {
                    data = JSON.parse(text);
                } catch {
                    resultDiv.innerHTML = `<span class="error">✗ Invalid JSON response:</span><pre>${text.substring(0, 500)}</pre>`;
                    return;
                }
                
                if (response.ok) {
                    if (data.success) {
                        resultDiv.innerHTML = `<span class="success">✓ API responding correctly</span><br>`;
                        if (data.data) {
                            resultDiv.innerHTML += `Found ${data.data.length} trips`;
                        }
                    } else {
                        resultDiv.innerHTML = `<span class="warning">⚠ API error: ${data.error || 'Unknown error'}</span>`;
                    }
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ HTTP ${response.status}: ${data.error || 'Unknown error'}</span>`;
                    if (response.status === 401) {
                        resultDiv.innerHTML += '<br><a href="/BTT/auth.php?action=login">Go to Login</a>';
                    }
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Network error: ${error.message}</span>`;
            }
        }
        
        async function fetchTrips() {
            const resultDiv = document.getElementById('trips-result');
            
            if (!window.BTTApi) {
                resultDiv.innerHTML = '<span class="error">✗ BTTApi not available</span>';
                return;
            }
            
            resultDiv.innerHTML = 'Fetching trips...';
            
            try {
                const trips = await BTTApi.get('trips');
                
                resultDiv.innerHTML = `<span class="success">✓ Fetched ${trips.length} trips</span>`;
                
                if (trips.length > 0) {
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(trips.slice(0, 2), null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML += '<br><span class="warning">No trips found. Try creating one.</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
                
                // Try direct fetch to see raw response
                try {
                    const response = await fetch('/BTT/api?route=trips', {
                        credentials: 'include'
                    });
                    const text = await response.text();
                    resultDiv.innerHTML += '<br>Raw response:<pre>' + text.substring(0, 500) + '</pre>';
                } catch (e) {
                    resultDiv.innerHTML += '<br>Could not fetch raw response';
                }
            }
        }
    </script>
</body>
</html>
