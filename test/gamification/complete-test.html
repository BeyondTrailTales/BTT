<!DOCTYPE html>
<html lang="en" data-theme="forest-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamification System - Complete Test</title>
    
    <!-- Forest Theme CSS -->
    <link rel="stylesheet" href="/BTT/assets/css/forest-tokens.css">
    <link rel="stylesheet" href="/BTT/assets/css/forest-base.css">
    <link rel="stylesheet" href="/BTT/assets/css/forest-components.css">
    <link rel="stylesheet" href="/BTT/assets/css/forest-animations.css">
    
    <style>
        body {
            padding: 2rem;
            background: var(--forest-deep);
            color: var(--text-primary);
        }
        
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .test-section {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            margin-bottom: var(--space-6);
        }
        
        .test-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-3);
            margin-top: var(--space-4);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--space-4);
            margin-top: var(--space-4);
        }
        
        .status-item {
            text-align: center;
            padding: var(--space-3);
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
        }
        
        .status-value {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--forest-mint);
        }
        
        .status-label {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-top: var(--space-1);
        }
        
        .xp-bar {
            height: 30px;
            background: var(--forest-shadow);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin: var(--space-4) 0;
            position: relative;
        }
        
        .xp-fill {
            height: 100%;
            background: var(--gradient-success);
            transition: width 0.5s ease-out;
            position: relative;
        }
        
        .xp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: var(--font-bold);
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: var(--space-3);
            margin-top: var(--space-4);
        }
        
        .badge-item {
            text-align: center;
            padding: var(--space-3);
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: 2px solid var(--glass-border);
            transition: var(--transition-all);
        }
        
        .badge-item.earned {
            border-color: var(--forest-leaf);
            background: linear-gradient(135deg, rgba(92, 184, 92, 0.1), rgba(139, 195, 74, 0.1));
        }
        
        .badge-item.locked {
            opacity: 0.5;
        }
        
        .badge-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .badge-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: var(--space-2);
        }
        
        .log-output {
            background: var(--forest-shadow);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-top: var(--space-4);
            max-height: 300px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: var(--text-sm);
        }
        
        .log-entry {
            padding: var(--space-2);
            border-bottom: 1px solid var(--glass-border);
        }
        
        .log-entry.success {
            color: var(--forest-leaf);
        }
        
        .log-entry.error {
            color: var(--forest-berry);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: var(--space-4);
            background: var(--gradient-success);
            color: var(--forest-deep);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-glow-lg);
            animation: slide-in 0.5s ease-out;
            z-index: 1000;
        }
        
        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .btn {
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            border: none;
            font-weight: var(--font-semibold);
            cursor: pointer;
            transition: var(--transition-all);
        }
        
        .btn-primary {
            background: var(--forest-fern);
            color: var(--forest-deep);
        }
        
        .btn-primary:hover {
            background: var(--forest-leaf);
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: var(--forest-berry);
            color: var(--text-primary);
        }
        
        .btn-danger:hover {
            background: var(--forest-mushroom);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 style="text-align: center; margin-bottom: var(--space-8);">
            <span style="background: linear-gradient(135deg, var(--forest-mint) 0%, var(--forest-fern) 50%, var(--forest-leaf) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                🎮 Gamification System Test Suite
            </span>
        </h1>
        
        <!-- Current Status -->
        <div class="test-section">
            <h2>📊 Current Status</h2>
            <div class="status-grid" id="status-grid">
                <!-- Will be populated by JavaScript -->
            </div>
            <div class="xp-bar">
                <div class="xp-fill" id="xp-bar-fill">
                    <span class="xp-text" id="xp-text">Loading...</span>
                </div>
            </div>
        </div>
        
        <!-- Test Actions -->
        <div class="test-section">
            <h2>🎯 Test Actions</h2>
            <div class="test-actions">
                <button class="btn btn-primary" onclick="testAction('backpack_created')">
                    🎒 Create Backpack
                </button>
                <button class="btn btn-primary" onclick="testAction('trip_created')">
                    🏕️ Create Trip
                </button>
                <button class="btn btn-primary" onclick="testAction('award_xp', {action: 'add_item', amount: 10})">
                    📦 Add Item (+10 XP)
                </button>
                <button class="btn btn-primary" onclick="testAction('update_streak')">
                    🔥 Update Streak
                </button>
                <button class="btn btn-primary" onclick="testAction('update_stats', {stat: 'total_items_packed', value: 10})">
                    📊 Update Stats
                </button>
                <button class="btn btn-danger" onclick="testAction('reset')">
                    🔄 Reset All
                </button>
            </div>
        </div>
        
        <!-- Badges -->
        <div class="test-section">
            <h2>🏆 Badges</h2>
            <div class="badge-grid" id="badge-grid">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
        
        <!-- Activity Log -->
        <div class="test-section">
            <h2>📝 Activity Log</h2>
            <div class="log-output" id="log-output">
                <div class="log-entry">System initialized...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/BTT/api/routes/gamification.php';
        
        // Load initial status
        loadStatus();
        loadBadges();
        
        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}?action=status`);
                const data = await response.json();
                updateStatusDisplay(data);
                addLog('Status loaded successfully', 'success');
            } catch (error) {
                addLog(`Error loading status: ${error.message}`, 'error');
            }
        }
        
        async function loadBadges() {
            try {
                const response = await fetch(`${API_BASE}?action=badges`);
                const data = await response.json();
                updateBadgeDisplay(data.badges);
            } catch (error) {
                addLog(`Error loading badges: ${error.message}`, 'error');
            }
        }
        
        async function testAction(action, payload = {}) {
            try {
                addLog(`Executing action: ${action}`);
                
                const response = await fetch(`${API_BASE}?action=${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                // Log the response
                addLog(`Response: ${JSON.stringify(data)}`, 'success');
                
                // Show notification if XP earned
                if (data.xp_gained) {
                    showNotification(`+${data.xp_gained} XP earned!`);
                }
                
                // Show badge notification if earned
                if (data.new_badges && data.new_badges.length > 0) {
                    data.new_badges.forEach(badge => {
                        showNotification(`🏆 Badge Earned: ${badge.name}!`);
                    });
                }
                
                // Show level up notification
                if (data.level_up) {
                    showNotification(`🎉 LEVEL UP! You're now level ${data.new_level}!`);
                }
                
                // Reload status and badges
                loadStatus();
                loadBadges();
                
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
            }
        }
        
        function updateStatusDisplay(data) {
            const grid = document.getElementById('status-grid');
            grid.innerHTML = `
                <div class="status-item">
                    <div class="status-value">${data.level}</div>
                    <div class="status-label">Level</div>
                </div>
                <div class="status-item">
                    <div class="status-value">${data.xp}</div>
                    <div class="status-label">Total XP</div>
                </div>
                <div class="status-item">
                    <div class="status-value">${data.xp_progress}%</div>
                    <div class="status-label">Progress</div>
                </div>
                <div class="status-item">
                    <div class="status-value">${data.streak_days} 🔥</div>
                    <div class="status-label">Streak</div>
                </div>
                <div class="status-item">
                    <div class="status-value">${data.badges.length}</div>
                    <div class="status-label">Badges</div>
                </div>
                <div class="status-item">
                    <div class="status-value">${data.xp_to_next_level}</div>
                    <div class="status-label">XP to Next</div>
                </div>
            `;
            
            // Update XP bar
            document.getElementById('xp-bar-fill').style.width = `${data.xp_progress}%`;
            document.getElementById('xp-text').textContent = `${data.xp} / ${data.next_level_threshold || 'MAX'} XP`;
        }
        
        function updateBadgeDisplay(badges) {
            const grid = document.getElementById('badge-grid');
            let html = '';
            
            badges.forEach(badge => {
                const earnedClass = badge.earned ? 'earned' : 'locked';
                html += `
                    <div class="badge-item ${earnedClass}" title="${badge.description}">
                        <span class="badge-icon">${badge.earned ? badge.icon : '🔒'}</span>
                        <div style="font-size: var(--text-xs); margin-top: var(--space-1);">
                            ${badge.name}
                        </div>
                    </div>
                `;
            });
            
            grid.innerHTML = html;
        }
        
        function addLog(message, type = '') {
            const log = document.getElementById('log-output');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.insertBefore(entry, log.firstChild);
            
            // Keep only last 20 entries
            while (log.children.length > 20) {
                log.removeChild(log.lastChild);
            }
        }
        
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slide-out 0.5s ease-out';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }
        
        // Add slide-out animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slide-out {
                to {
                    transform: translateX(120%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
