<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trips E2E Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
        }
        
        .test-sidebar {
            width: 400px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
        }
        
        .test-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .test-header {
            background: #1a1a1a;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .test-iframe-container {
            flex: 1;
            position: relative;
            background: #000;
        }
        
        #test-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        h1 {
            font-size: 1.5rem;
            color: #4ade80;
            margin-bottom: 20px;
        }
        
        h2 {
            font-size: 1.2rem;
            color: #4ade80;
            margin: 20px 0 10px;
        }
        
        .test-controls {
            margin-bottom: 20px;
        }
        
        button {
            background: #4ade80;
            color: #0a2818;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #22c55e;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .test-suite {
            margin-bottom: 15px;
            background: #2a2a2a;
            border-radius: 5px;
            padding: 10px;
        }
        
        .test-suite h3 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .test-case {
            padding: 8px;
            margin: 5px 0;
            background: #1a1a1a;
            border-radius: 3px;
            border-left: 3px solid #666;
            font-size: 0.9rem;
        }
        
        .test-case.running {
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }
        
        .test-case.passed {
            border-left-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }
        
        .test-case.failed {
            border-left-color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }
        
        .test-case .status {
            float: right;
            font-weight: 600;
        }
        
        .test-results {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 5px;
        }
        
        .test-log {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
        }
        
        .log-entry.info { color: #94a3b8; }
        .log-entry.success { color: #4ade80; }
        .log-entry.error { color: #f87171; }
        .log-entry.warning { color: #fbbf24; }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .stat {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4ade80;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="test-sidebar">
        <h1>🧪 Trips E2E Test Suite</h1>
        
        <div class="test-controls">
            <button id="btn-run-all">▶️ Run All Tests</button>
            <button id="btn-clear-log">🗑️ Clear Log</button>
            <button id="btn-reload-frame">🔄 Reload Page</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="test-suites" id="test-suites">
            <!-- Test suites will be populated here -->
        </div>
        
        <div class="test-results">
            <h2>📊 Results</h2>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="stat-passed">0</div>
                    <div class="stat-label">Passed</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="stat-failed">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
            <div class="test-log" id="test-log"></div>
        </div>
    </div>
    
    <div class="test-main">
        <div class="test-header">
            <span>🌐 Trips Interface - Test Environment</span>
            <span id="frame-status">Loading...</span>
        </div>
        <div class="test-iframe-container">
            <iframe id="test-frame" src="../trips.php"></iframe>
        </div>
    </div>

    <script>
        // Test Framework
        class E2ETestRunner {
            constructor() {
                this.frame = document.getElementById('test-frame');
                this.log = document.getElementById('test-log');
                this.progress = document.getElementById('progress');
                this.suites = [];
                this.results = { passed: 0, failed: 0, total: 0 };
                this.isRunning = false;
                
                this.initializeTestSuites();
                this.bindEvents();
            }
            
            initializeTestSuites() {
                this.suites = [
                    {
                        name: '🎯 Core Functionality',
                        tests: [
                            { name: 'Page loads without errors', fn: this.testPageLoad.bind(this) },
                            { name: 'No overlay elements present', fn: this.testNoOverlays.bind(this) },
                            { name: 'Main containers exist', fn: this.testMainContainers.bind(this) },
                            { name: 'API utilities loaded', fn: this.testApiUtilities.bind(this) }
                        ]
                    },
                    {
                        name: '⌨️ Keyboard Navigation',
                        tests: [
                            { name: 'Tab through top navigation', fn: this.testTopTabKeyboard.bind(this) },
                            { name: 'Tab through form fields', fn: this.testFormTabbing.bind(this) },
                            { name: 'Arrow keys in tabs', fn: this.testTabArrowKeys.bind(this) },
                            { name: 'Escape key in search', fn: this.testSearchEscape.bind(this) }
                        ]
                    },
                    {
                        name: '🔄 CRUD Operations',
                        tests: [
                            { name: 'Create new trip', fn: this.testCreateTrip.bind(this) },
                            { name: 'Edit existing trip', fn: this.testEditTrip.bind(this) },
                            { name: 'Delete trip', fn: this.testDeleteTrip.bind(this) },
                            { name: 'Search trips', fn: this.testSearchTrips.bind(this) }
                        ]
                    },
                    {
                        name: '♿ Accessibility',
                        tests: [
                            { name: 'ARIA labels present', fn: this.testAriaLabels.bind(this) },
                            { name: 'Focus management', fn: this.testFocusManagement.bind(this) },
                            { name: 'Form validation', fn: this.testFormValidation.bind(this) },
                            { name: 'Live regions', fn: this.testLiveRegions.bind(this) }
                        ]
                    },
                    {
                        name: '📱 Responsive Design',
                        tests: [
                            { name: 'Mobile viewport', fn: this.testMobileView.bind(this) },
                            { name: 'Tablet viewport', fn: this.testTabletView.bind(this) },
                            { name: 'Desktop viewport', fn: this.testDesktopView.bind(this) },
                            { name: 'Touch interactions', fn: this.testTouchInteractions.bind(this) }
                        ]
                    }
                ];
                
                this.renderTestSuites();
            }
            
            renderTestSuites() {
                const container = document.getElementById('test-suites');
                container.innerHTML = this.suites.map((suite, suiteIdx) => `
                    <div class="test-suite" data-suite="${suiteIdx}">
                        <h3>${suite.name}</h3>
                        ${suite.tests.map((test, testIdx) => `
                            <div class="test-case" data-test="${testIdx}" id="test-${suiteIdx}-${testIdx}">
                                ${test.name}
                                <span class="status"></span>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            }
            
            bindEvents() {
                document.getElementById('btn-run-all').addEventListener('click', () => this.runAllTests());
                document.getElementById('btn-clear-log').addEventListener('click', () => this.clearLog());
                document.getElementById('btn-reload-frame').addEventListener('click', () => this.reloadFrame());
                
                this.frame.addEventListener('load', () => {
                    document.getElementById('frame-status').textContent = '✅ Loaded';
                    this.addLog('Page loaded successfully', 'success');
                });
            }
            
            async runAllTests() {
                if (this.isRunning) return;
                
                this.isRunning = true;
                this.clearResults();
                this.addLog('Starting test run...', 'info');
                
                let completed = 0;
                const total = this.suites.reduce((sum, suite) => sum + suite.tests.length, 0);
                
                for (let suiteIdx = 0; suiteIdx < this.suites.length; suiteIdx++) {
                    const suite = this.suites[suiteIdx];
                    this.addLog(`\nRunning suite: ${suite.name}`, 'info');
                    
                    for (let testIdx = 0; testIdx < suite.tests.length; testIdx++) {
                        const test = suite.tests[testIdx];
                        const testEl = document.getElementById(`test-${suiteIdx}-${testIdx}`);
                        
                        testEl.className = 'test-case running';
                        testEl.querySelector('.status').textContent = '⏳';
                        
                        try {
                            await test.fn();
                            this.markTestPassed(testEl, test.name);
                        } catch (error) {
                            this.markTestFailed(testEl, test.name, error);
                        }
                        
                        completed++;
                        this.updateProgress(completed, total);
                        await this.wait(100); // Small delay between tests
                    }
                }
                
                this.isRunning = false;
                this.showSummary();
            }
            
            markTestPassed(element, testName) {
                element.className = 'test-case passed';
                element.querySelector('.status').textContent = '✅';
                this.results.passed++;
                this.results.total++;
                this.updateStats();
                this.addLog(`✅ ${testName}`, 'success');
            }
            
            markTestFailed(element, testName, error) {
                element.className = 'test-case failed';
                element.querySelector('.status').textContent = '❌';
                this.results.failed++;
                this.results.total++;
                this.updateStats();
                this.addLog(`❌ ${testName}: ${error.message}`, 'error');
            }
            
            updateProgress(completed, total) {
                const percentage = (completed / total) * 100;
                this.progress.style.width = `${percentage}%`;
            }
            
            updateStats() {
                document.getElementById('stat-passed').textContent = this.results.passed;
                document.getElementById('stat-failed').textContent = this.results.failed;
                document.getElementById('stat-total').textContent = this.results.total;
            }
            
            showSummary() {
                const passRate = (this.results.passed / this.results.total * 100).toFixed(1);
                const status = this.results.failed === 0 ? '🎉 All tests passed!' : `⚠️ ${this.results.failed} tests failed`;
                this.addLog(`\n${status}`, this.results.failed === 0 ? 'success' : 'warning');
                this.addLog(`Pass rate: ${passRate}%`, 'info');
            }
            
            clearResults() {
                this.results = { passed: 0, failed: 0, total: 0 };
                this.updateStats();
                this.progress.style.width = '0%';
                document.querySelectorAll('.test-case').forEach(el => {
                    el.className = 'test-case';
                    el.querySelector('.status').textContent = '';
                });
            }
            
            clearLog() {
                this.log.innerHTML = '';
            }
            
            addLog(message, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                this.log.appendChild(entry);
                this.log.scrollTop = this.log.scrollHeight;
            }
            
            reloadFrame() {
                this.frame.src = this.frame.src;
                document.getElementById('frame-status').textContent = '⏳ Reloading...';
            }
            
            wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
            
            getFrameWindow() {
                return this.frame.contentWindow;
            }
            
            getFrameDocument() {
                return this.frame.contentDocument || this.frame.contentWindow.document;
            }
            
            // Test implementations
            async testPageLoad() {
                const win = this.getFrameWindow();
                if (!win) throw new Error('Frame window not accessible');
                
                // Check for JavaScript errors
                const hasErrors = win.console && win.console.error;
                if (hasErrors) {
                    // Check if there are actual errors logged
                    // This is a simplified check
                }
                
                return true;
            }
            
            async testNoOverlays() {
                const doc = this.getFrameDocument();
                const overlays = doc.querySelectorAll('#trip-form-panel, .overlay, .modal-overlay');
                if (overlays.length > 0) {
                    throw new Error(`Found ${overlays.length} overlay elements`);
                }
                return true;
            }
            
            async testMainContainers() {
                const doc = this.getFrameDocument();
                const containers = [
                    '#main-content',
                    '#panel-my-trips',
                    '#panel-trip-editor',
                    '#trip-grid',
                    '#trip-form'
                ];
                
                for (const selector of containers) {
                    const el = doc.querySelector(selector);
                    if (!el) throw new Error(`Missing container: ${selector}`);
                }
                
                return true;
            }
            
            async testApiUtilities() {
                const win = this.getFrameWindow();
                if (!win.BTTApi) throw new Error('BTTApi not loaded');
                if (!win.BTTUtils) throw new Error('BTTUtils not loaded');
                return true;
            }
            
            async testTopTabKeyboard() {
                const doc = this.getFrameDocument();
                const tabMyTrips = doc.getElementById('tab-my-trips');
                const tabEditor = doc.getElementById('tab-trip-editor');
                
                if (!tabMyTrips || !tabEditor) {
                    throw new Error('Tab buttons not found');
                }
                
                // Simulate tab navigation
                tabMyTrips.focus();
                await this.wait(100);
                
                // Check if focused
                if (doc.activeElement !== tabMyTrips) {
                    throw new Error('Tab focus not working');
                }
                
                return true;
            }
            
            async testFormTabbing() {
                const doc = this.getFrameDocument();
                const formInputs = doc.querySelectorAll('#trip-form input, #trip-form select, #trip-form textarea');
                
                if (formInputs.length === 0) {
                    throw new Error('No form inputs found');
                }
                
                // Check if inputs are tabbable
                for (const input of formInputs) {
                    if (input.tabIndex === -1 && !input.disabled) {
                        throw new Error(`Input ${input.id} is not tabbable`);
                    }
                }
                
                return true;
            }
            
            async testTabArrowKeys() {
                const doc = this.getFrameDocument();
                const win = this.getFrameWindow();
                const tabs = doc.querySelectorAll('.pack-tab');
                
                if (tabs.length < 2) {
                    throw new Error('Not enough tabs for arrow key navigation');
                }
                
                // Simulate arrow key event
                const event = new win.KeyboardEvent('keydown', {
                    key: 'ArrowRight',
                    bubbles: true
                });
                
                tabs[0].focus();
                tabs[0].dispatchEvent(event);
                
                return true;
            }
            
            async testSearchEscape() {
                const doc = this.getFrameDocument();
                const win = this.getFrameWindow();
                const searchInput = doc.getElementById('trip-search');
                
                if (!searchInput) throw new Error('Search input not found');
                
                searchInput.value = 'test';
                const event = new win.KeyboardEvent('keydown', {
                    key: 'Escape',
                    bubbles: true
                });
                searchInput.dispatchEvent(event);
                
                await this.wait(100);
                
                // Note: The actual clearing might be handled by the app's JS
                // This test verifies the event can be dispatched
                
                return true;
            }
            
            async testCreateTrip() {
                const doc = this.getFrameDocument();
                const btnNew = doc.getElementById('btn-new-trip');
                
                if (!btnNew) throw new Error('New trip button not found');
                
                btnNew.click();
                await this.wait(500);
                
                // Check if editor is visible
                const editor = doc.getElementById('panel-trip-editor');
                if (!editor.classList.contains('active')) {
                    throw new Error('Editor panel not activated');
                }
                
                return true;
            }
            
            async testEditTrip() {
                const doc = this.getFrameDocument();
                // This would require existing trips - simplified test
                const cards = doc.querySelectorAll('.trip-card');
                
                if (cards.length > 0) {
                    const editBtn = cards[0].querySelector('[data-action="edit"]');
                    if (editBtn) {
                        editBtn.click();
                        await this.wait(500);
                    }
                }
                
                return true;
            }
            
            async testDeleteTrip() {
                const doc = this.getFrameDocument();
                // This test verifies delete button exists and is clickable
                const deleteButtons = doc.querySelectorAll('[data-action="delete"]');
                
                if (deleteButtons.length === 0) {
                    // No trips to delete, which is fine
                    return true;
                }
                
                // Verify delete button has proper attributes
                const btn = deleteButtons[0];
                if (!btn.hasAttribute('aria-label')) {
                    throw new Error('Delete button missing aria-label');
                }
                
                return true;
            }
            
            async testSearchTrips() {
                const doc = this.getFrameDocument();
                const searchInput = doc.getElementById('trip-search');
                
                if (!searchInput) throw new Error('Search input not found');
                
                // Simulate typing
                searchInput.value = 'test search';
                const event = new Event('input', { bubbles: true });
                searchInput.dispatchEvent(event);
                
                await this.wait(300); // Wait for debounce
                
                return true;
            }
            
            async testAriaLabels() {
                const doc = this.getFrameDocument();
                const elements = doc.querySelectorAll('[role]');
                
                if (elements.length === 0) {
                    throw new Error('No ARIA roles found');
                }
                
                // Check for important ARIA attributes
                const importantRoles = ['navigation', 'tablist', 'tab', 'tabpanel', 'search'];
                for (const role of importantRoles) {
                    const el = doc.querySelector(`[role="${role}"]`);
                    if (!el) {
                        throw new Error(`Missing ARIA role: ${role}`);
                    }
                }
                
                return true;
            }
            
            async testFocusManagement() {
                const doc = this.getFrameDocument();
                const focusableElements = doc.querySelectorAll(
                    'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
                );
                
                if (focusableElements.length === 0) {
                    throw new Error('No focusable elements found');
                }
                
                // Check if focus styles are defined
                const styles = doc.styleSheets;
                let hasFocusStyles = false;
                
                for (const sheet of styles) {
                    try {
                        const rules = sheet.cssRules || sheet.rules;
                        for (const rule of rules) {
                            if (rule.selectorText && rule.selectorText.includes(':focus')) {
                                hasFocusStyles = true;
                                break;
                            }
                        }
                    } catch (e) {
                        // Cross-origin stylesheets might throw
                    }
                }
                
                return true;
            }
            
            async testFormValidation() {
                const doc = this.getFrameDocument();
                const form = doc.getElementById('trip-form');
                
                if (!form) throw new Error('Trip form not found');
                
                // Check for validation attributes
                const requiredFields = form.querySelectorAll('[required]');
                if (requiredFields.length === 0) {
                    throw new Error('No required fields found');
                }
                
                // Check for error container
                const errorContainer = doc.getElementById('form-errors');
                if (!errorContainer) {
                    throw new Error('Form error container not found');
                }
                
                return true;
            }
            
            async testLiveRegions() {
                const doc = this.getFrameDocument();
                const liveRegions = doc.querySelectorAll('[aria-live]');
                
                if (liveRegions.length === 0) {
                    throw new Error('No ARIA live regions found');
                }
                
                // Check for status region
                const statusRegion = doc.querySelector('[role="status"]');
                if (!statusRegion) {
                    throw new Error('Status region not found');
                }
                
                return true;
            }
            
            async testMobileView() {
                // Set viewport to mobile size
                this.frame.style.width = '375px';
                await this.wait(300);
                
                const doc = this.getFrameDocument();
                const actionBar = doc.querySelector('.pack-action-bar');
                
                if (!actionBar) throw new Error('Action bar not found');
                
                // Reset viewport
                this.frame.style.width = '100%';
                
                return true;
            }
            
            async testTabletView() {
                // Set viewport to tablet size
                this.frame.style.width = '768px';
                await this.wait(300);
                
                const doc = this.getFrameDocument();
                const grid = doc.querySelector('.packs-grid');
                
                if (!grid) throw new Error('Grid not found');
                
                // Reset viewport
                this.frame.style.width = '100%';
                
                return true;
            }
            
            async testDesktopView() {
                // Set viewport to desktop size
                this.frame.style.width = '1440px';
                await this.wait(300);
                
                const doc = this.getFrameDocument();
                const builderLayout = doc.querySelector('.builder-layout');
                
                // Reset viewport
                this.frame.style.width = '100%';
                
                return true;
            }
            
            async testTouchInteractions() {
                const doc = this.getFrameDocument();
                const cards = doc.querySelectorAll('.trip-card');
                
                // Check if cards have touch-friendly sizing
                for (const card of cards) {
                    const rect = card.getBoundingClientRect();
                    if (rect.height < 44) { // Minimum touch target size
                        throw new Error('Card too small for touch interaction');
                    }
                }
                
                return true;
            }
        }
        
        // Initialize test runner when page loads
        window.addEventListener('DOMContentLoaded', () => {
            const runner = new E2ETestRunner();
            window.testRunner = runner; // Expose for debugging
        });
    </script>
</body>
</html>
