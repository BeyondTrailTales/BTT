<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pack Builder Frontend Check</title>
    <style>
        body { 
            font-family: monospace; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #0f0;
        }
        .check { margin: 10px 0; }
        .pass { color: #0f0; }
        .fail { color: #f00; }
        .info { color: #ff0; }
        h2 { color: #0ff; }
        pre { 
            background: #000; 
            padding: 10px; 
            border: 1px solid #0f0;
            overflow-x: auto;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Pack Builder Frontend Diagnostic</h1>
    <div id="results"></div>
    
    <h2>Quick Actions</h2>
    <button onclick="testCreatePack()">Test Create Pack</button>
    <button onclick="testLoadPacks()">Test Load Packs</button>
    <button onclick="window.open('/BTT/public/backpacks.php', '_blank')">Open Pack Builder</button>
    
    <h2>Console Output</h2>
    <pre id="console"></pre>
    
    <script>
    function log(message, type = 'info') {
        const color = type === 'pass' ? 'pass' : type === 'fail' ? 'fail' : 'info';
        $('#results').append(`<div class="check ${color}">${type.toUpperCase()}: ${message}</div>`);
    }
    
    function logConsole(message) {
        $('#console').append(message + '\n');
    }
    
    // Check if PackBuilder is loaded
    setTimeout(() => {
        // Load the pack builder page in an iframe to check initialization
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = '/BTT/public/backpacks.php';
        iframe.onload = function() {
            const iframeWindow = iframe.contentWindow;
            
            // Check jQuery
            if (iframeWindow.$ && iframeWindow.jQuery) {
                log('jQuery loaded', 'pass');
            } else {
                log('jQuery NOT loaded', 'fail');
            }
            
            // Check PackBuilder
            if (iframeWindow.PackBuilder) {
                log('PackBuilder object exists', 'pass');
                
                // Check key methods
                const methods = ['init', 'loadPacks', 'savePack', 'createNewPack', 'editPack'];
                methods.forEach(method => {
                    if (typeof iframeWindow.PackBuilder[method] === 'function') {
                        log(`PackBuilder.${method} exists`, 'pass');
                    } else {
                        log(`PackBuilder.${method} missing`, 'fail');
                    }
                });
                
                // Check state
                if (iframeWindow.PackBuilder.state) {
                    log('PackBuilder.state exists', 'pass');
                    logConsole('State: ' + JSON.stringify(iframeWindow.PackBuilder.state, null, 2));
                }
            } else {
                log('PackBuilder NOT loaded', 'fail');
            }
            
            // Check PackBuilderCRUD
            if (iframeWindow.PackBuilderCRUD) {
                log('PackBuilderCRUD loaded', 'pass');
            } else {
                log('PackBuilderCRUD NOT loaded', 'fail');
            }
            
            // Check API configuration
            if (iframeWindow.BTT) {
                log('BTT config loaded', 'pass');
                logConsole('BTT Config: ' + JSON.stringify(iframeWindow.BTT, null, 2));
            } else {
                log('BTT config NOT loaded', 'fail');
            }
        };
        document.body.appendChild(iframe);
    }, 1000);
    
    // Test functions
    async function testCreatePack() {
        logConsole('Testing pack creation...');
        
        const testPack = {
            name: 'Frontend Test Pack ' + Date.now(),
            description: 'Created from frontend test',
            capacity_l: 40,
            weight_empty_g: 900,
            type: 'custom',
            sections: []
        };
        
        try {
            const response = await $.ajax({
                url: '/BTT/api/index.php?route=backpacks',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(testPack)
            });
            
            if (response.success) {
                logConsole('✅ Pack created: ID ' + response.data.id);
                log('Pack creation successful', 'pass');
                
                // Auto-delete after 5 seconds
                setTimeout(() => {
                    $.ajax({
                        url: '/BTT/api/index.php?route=backpacks&id=' + response.data.id,
                        method: 'DELETE'
                    }).then(() => {
                        logConsole('Cleaned up test pack');
                    });
                }, 5000);
            }
        } catch (error) {
            logConsole('❌ Error: ' + error.responseText);
            log('Pack creation failed', 'fail');
        }
    }
    
    async function testLoadPacks() {
        logConsole('Loading packs...');
        
        try {
            const response = await $.ajax({
                url: '/BTT/api/index.php?route=backpacks',
                method: 'GET'
            });
            
            if (response.success) {
                logConsole('✅ Loaded ' + response.data.length + ' packs');
                response.data.slice(0, 5).forEach(pack => {
                    logConsole(`  - ${pack.name} (ID: ${pack.id})`);
                });
                log('Pack loading successful', 'pass');
            }
        } catch (error) {
            logConsole('❌ Error: ' + error.responseText);
            log('Pack loading failed', 'fail');
        }
    }
    
    // Auto-run basic test
    $(document).ready(function() {
        log('Page loaded, starting diagnostics...', 'info');
    });
    </script>
</body>
</html>
