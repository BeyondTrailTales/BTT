<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Flow</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            background: #4ade80;
            border: none;
            padding: 10px 20px;
            color: #000;
            cursor: pointer;
            margin: 5px;
            border-radius: 4px;
        }
        button:hover {
            background: #22c55e;
        }
        .output {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            color: #4ade80;
        }
        .error {
            color: #ef4444;
        }
        input {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            margin: 5px 0;
            width: 300px;
            border-radius: 4px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Login Flow</h1>
        
        <div>
            <label>Username/Email:</label>
            <input type="text" id="username" value="admin" />
            
            <label>Password:</label>
            <input type="password" id="password" value="Admin123!" />
        </div>
        
        <div style="margin: 20px 0;">
            <button onclick="checkAuth()">1. Check Auth Status</button>
            <button onclick="testLogin()">2. Test Login</button>
            <button onclick="checkAuthAfterLogin()">3. Check Auth After Login</button>
            <button onclick="testDashboard()">4. Test Dashboard Access</button>
            <button onclick="testLogout()">5. Test Logout</button>
        </div>
        
        <h2>Output:</h2>
        <div id="output" class="output"></div>
    </div>

    <script>
        const baseUrl = 'http://localhost/BTT';
        
        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }
        
        async function checkAuth() {
            log('Checking authentication status...');
            try {
                const response = await fetch(`${baseUrl}/test/check-auth.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                log('Auth Status Response:', 'success');
                log(JSON.stringify(data, null, 2));
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
        
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log(`Attempting login with username: ${username}`);
            
            try {
                // First get CSRF token if needed
                const authResponse = await fetch(`${baseUrl}/api/index.php?route=auth`, {
                    credentials: 'include'
                });
                const authData = await authResponse.json();
                const csrfToken = authData.data?.csrf_token || '';
                
                log(`Got CSRF token: ${csrfToken.substring(0, 8)}...`);
                
                // Now attempt login
                const response = await fetch(`${baseUrl}/api/index.php?route=auth&id=login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({
                        login: username,
                        password: password,
                        remember: false,
                        csrf_token: csrfToken
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('Login successful!', 'success');
                    log(JSON.stringify(data, null, 2), 'success');
                } else {
                    log('Login failed!', 'error');
                    log(JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
        
        async function checkAuthAfterLogin() {
            log('Checking auth status after login...');
            await checkAuth();
        }
        
        async function testDashboard() {
            log('Testing dashboard access...');
            try {
                const response = await fetch(`${baseUrl}/dashboard`, {
                    credentials: 'include',
                    redirect: 'manual'
                });
                
                log(`Dashboard Response Status: ${response.status}`);
                log(`Response Type: ${response.type}`);
                log(`Redirected: ${response.redirected}`);
                
                if (response.status === 200) {
                    log('Dashboard accessible!', 'success');
                } else if (response.status === 0 || response.type === 'opaqueredirect') {
                    log('Redirect detected (likely to login page)', 'error');
                } else {
                    log(`Unexpected status: ${response.status}`, 'error');
                }
                
                // Also check with normal redirect follow
                const response2 = await fetch(`${baseUrl}/dashboard`, {
                    credentials: 'include'
                });
                
                if (response2.ok) {
                    const text = await response2.text();
                    if (text.includes('Welcome back') || text.includes('Dashboard')) {
                        log('Dashboard content verified!', 'success');
                    } else if (text.includes('Login') || text.includes('Sign in')) {
                        log('Got login page instead of dashboard', 'error');
                    }
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
        
        async function testLogout() {
            log('Testing logout...');
            try {
                const response = await fetch(`${baseUrl}/api/index.php?route=auth&id=logout`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                if (data.success) {
                    log('Logout successful!', 'success');
                } else {
                    log('Logout failed!', 'error');
                }
                log(JSON.stringify(data, null, 2));
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
        
        // Initial check on load
        window.addEventListener('load', () => {
            log('Test page loaded. Click the buttons in order to test the login flow.');
        });
    </script>
</body>
</html>
