<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Pack Save</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Pack Save Test</h1>
    <button onclick="testPackSave()">Test Pack Save</button>
    <pre id="output"></pre>

    <script src="../assets/js/api.js"></script>
    <script>
    async function testPackSave() {
        const output = document.getElementById('output');
        output.textContent = 'Testing pack save...\n';
        
        try {
            const testData = {
                name: 'Test Pack ' + Date.now(),
                description: 'Test Description',
                capacity_l: 65,
                weight_empty_g: 2000,
                type: 'custom',
                sections: [
                    {
                        id: 'main',
                        name: 'Main Compartment',
                        items: [],
                        order: 0
                    }
                ]
            };
            
            output.textContent += 'Sending data:\n' + JSON.stringify(testData, null, 2) + '\n\n';
            
            const result = await BttApi.backpacks.create(testData);
            
            output.textContent += 'Success! Result:\n' + JSON.stringify(result, null, 2);
            
        } catch (error) {
            output.textContent += 'Error: ' + error.message + '\n';
            output.textContent += 'Stack: ' + error.stack;
        }
    }
    
    // Test on load
    window.addEventListener('load', function() {
        setTimeout(function() {
            const output = document.getElementById('output');
            if (typeof BttApi !== 'undefined') {
                output.textContent = 'BttApi is ready\n';
            } else {
                output.textContent = 'BttApi is NOT defined\n';
            }
        }, 1000);
    });
    </script>
</body>
</html>
