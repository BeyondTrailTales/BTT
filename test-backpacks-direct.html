<!DOCTYPE html>
<html>
<head>
    <title>Direct Backpacks Test - Fixed Version</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #00ff00; }
        .result { background: #333; padding: 10px; margin: 10px 0; border: 1px solid #555; border-radius: 5px; }
        .success { border-color: #0f0; }
        .error { border-color: #f00; color: #ff6666; }
        button { padding: 10px 20px; margin: 5px; background: #333; color: #0f0; border: 1px solid #555; cursor: pointer; }
        button:hover { background: #555; }
        pre { background: #000; padding: 10px; overflow: auto; border: 1px solid #555; }
        .timestamp { color: #888; font-size: 0.8em; }
        h1 { color: #52ffb8; }
        .status-ok { color: #0f0; }
        .status-error { color: #f00; }
    </style>
</head>
<body>
    <h1>🎒 Direct Backpacks API Test - FIXED VERSION</h1>
    <p>This test bypasses all JavaScript caching and tests the API directly.</p>
    
    <div>
        <button onclick="testApiStatus()">1. Test API Status</button>
        <button onclick="testDirectBackpacks()">2. Test Backpacks Endpoint</button>
        <button onclick="testCreateBackpack()">3. Create Test Backpack</button>
        <button onclick="testListAgain()">4. List Backpacks Again</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            document.getElementById('results').appendChild(div);
            console.log(`[${timestamp}] ${message}`);
            
            // Auto-scroll to bottom
            div.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testApiStatus() {
            log('🔍 Testing API Status...', 'info');
            try {
                const response = await fetch('/BTT/api-status.php', {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const status = data.status === 'ok' ? 'status-ok' : 'status-error';
                    log(`✅ API Status: <span class="${status}">${data.status.toUpperCase()}</span>`, 'success');
                    log(`📊 <pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                    
                    if (data.authenticated) {
                        log(`👤 Authenticated as user: ${data.user_id}`, 'success');
                    } else {
                        log(`⚠️ Not authenticated - you may need to login first`, 'error');
                    }
                } else {
                    log(`❌ Status check failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`💥 Status check error: ${error.message}`, 'error');
            }
        }

        async function testDirectBackpacks() {
            log('🎒 Testing Backpacks Endpoint...', 'info');
            try {
                const timestamp = Date.now();
                const response = await fetch(`/BTT/ajax-handler.php?route=backpacks&_=${timestamp}`, {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-cache',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                log(`📡 Response Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const rawText = await response.text();
                    log(`📝 Raw Response Length: ${rawText.length} characters`, 'info');
                    
                    if (rawText.length > 0) {
                        try {
                            const data = JSON.parse(rawText);
                            log(`✅ JSON Parse Success`, 'success');
                            
                            if (Array.isArray(data)) {
                                log(`🎒 Found ${data.length} backpacks`, 'success');
                                if (data.length > 0) {
                                    log(`📋 First backpack: ${JSON.stringify(data[0], null, 2)}`, 'info');
                                }
                            } else {
                                log(`📊 Response structure: <pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                            }
                        } catch (parseError) {
                            log(`❌ JSON Parse Failed: ${parseError.message}`, 'error');
                            log(`🔍 Raw response preview: <pre>${rawText.substring(0, 500)}${rawText.length > 500 ? '...' : ''}</pre>`, 'error');
                        }
                    } else {
                        log(`⚠️ Empty response received`, 'error');
                    }
                } else {
                    const errorText = await response.text();
                    log(`❌ Error Response: <pre>${errorText}</pre>`, 'error');
                }
            } catch (error) {
                log(`💥 Request failed: ${error.message}`, 'error');
            }
        }

        async function testCreateBackpack() {
            log('➕ Creating test backpack...', 'info');
            try {
                const testPack = {
                    name: `Test Pack ${Date.now()}`,
                    description: 'Created by direct test',
                    capacity_l: 65,
                    weight_empty_g: 2000,
                    type: 'test',
                    sections: [
                        {
                            id: 'main',
                            name: 'Main',
                            items: [
                                {
                                    name: 'Test Item',
                                    weight_g: 100,
                                    quantity: 1,
                                    category: 'other'
                                }
                            ]
                        }
                    ]
                };
                
                const response = await fetch('/BTT/ajax-handler.php?route=backpacks', {
                    method: 'POST',
                    credentials: 'same-origin',
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        'Cache-Control': 'no-cache'
                    },
                    body: JSON.stringify(testPack)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ Backpack created successfully!`, 'success');
                    log(`📊 Created pack: <pre>${JSON.stringify(result, null, 2)}</pre>`, 'success');
                } else {
                    const errorText = await response.text();
                    log(`❌ Create failed: ${response.status} ${response.statusText}`, 'error');
                    log(`Error details: <pre>${errorText}</pre>`, 'error');
                }
            } catch (error) {
                log(`💥 Create error: ${error.message}`, 'error');
            }
        }

        async function testListAgain() {
            log('🔄 Listing backpacks again...', 'info');
            await testDirectBackpacks();
        }

        // Auto-run basic tests on page load
        window.addEventListener('load', function() {
            log('🚀 Page loaded - running initial tests...', 'info');
            setTimeout(testApiStatus, 100);
            setTimeout(testDirectBackpacks, 1000);
        });
    </script>
</body>
</html>
