<!DOCTYPE html>
<html>
<head>
    <title>Simple Photo Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="file"] { 
            padding: 0.5rem; 
            border: 2px dashed #4ade80; 
            border-radius: 8px; 
            width: 100%; 
            background: transparent;
        }
        input[type="text"] { 
            padding: 0.5rem; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            width: 100%; 
        }
        .btn { 
            padding: 0.75rem 1.5rem; 
            background: #4ade80; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            margin-right: 0.5rem;
        }
        .btn:hover { background: #22c55e; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        #preview { 
            margin-top: 1rem; 
            max-width: 100%; 
            border-radius: 8px; 
            display: none;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .status { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Simple Photo Upload Test</h1>
        <p>Test photo upload functionality isolated from the main trips form.</p>
        
        <form id="photo-test-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="trip_title">Trip Title:</label>
                <input type="text" id="trip_title" name="title" value="Photo Test Trip" required>
            </div>
            
            <div class="form-group">
                <label for="photo_file">Photo Upload:</label>
                <input type="file" id="photo_file" name="photo" accept="image/jpeg,image/jpg,image/png">
            </div>
            
            <div class="form-group">
                <label for="photo_alt">Photo Description:</label>
                <input type="text" id="photo_alt" name="photo_alt_text" placeholder="Describe the photo for accessibility">
            </div>
            
            <button type="button" class="btn" onclick="testUpload()">🚀 Test Upload</button>
            <button type="button" class="btn btn-danger" onclick="clearForm()">🗑️ Clear</button>
        </form>
        
        <img id="preview" alt="Preview">
        <div id="status" class="status"></div>
        
        <h2>📝 Debug Info</h2>
        <div id="debug"></div>
    </div>

    <script>
        // Photo preview
        document.getElementById('photo_file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('preview');
            const status = document.getElementById('status');
            
            if (file) {
                // Validate file type
                const validTypes = ['image/jpeg', 'image/jpg', 'image/png'];
                if (!validTypes.includes(file.type)) {
                    status.innerHTML = '<span class="error">❌ Invalid file type. Please select JPG, JPEG, or PNG.</span>';
                    e.target.value = '';
                    preview.style.display = 'none';
                    return;
                }
                
                // Validate file size (4MB max)
                const maxSize = 4 * 1024 * 1024;
                if (file.size > maxSize) {
                    status.innerHTML = '<span class="error">❌ File too large. Maximum size is 4MB.</span>';
                    e.target.value = '';
                    preview.style.display = 'none';
                    return;
                }
                
                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    status.innerHTML = '<span class="success">✅ Photo loaded and ready to upload</span>';
                };
                reader.readAsDataURL(file);
                
                // Auto-generate alt text if empty
                const altText = document.getElementById('photo_alt');
                if (!altText.value.trim()) {
                    altText.value = `Photo from ${document.getElementById('trip_title').value}`;
                }
            } else {
                preview.style.display = 'none';
                status.innerHTML = '';
            }
        });
        
        async function testUpload() {
            const form = document.getElementById('photo-test-form');
            const formData = new FormData(form);
            const status = document.getElementById('status');
            const debug = document.getElementById('debug');
            
            // Add debug info
            const photoFile = document.getElementById('photo_file').files[0];
            let debugInfo = '<h3>Form Data:</h3><ul>';
            
            for (let pair of formData.entries()) {
                if (pair[0] === 'photo' && pair[1] instanceof File) {
                    debugInfo += `<li><strong>${pair[0]}:</strong> ${pair[1].name} (${pair[1].size} bytes, ${pair[1].type})</li>`;
                } else {
                    debugInfo += `<li><strong>${pair[0]}:</strong> ${pair[1]}</li>`;
                }
            }
            debugInfo += '</ul>';
            
            if (!photoFile) {
                status.innerHTML = '<span class="error">❌ No photo selected</span>';
                debug.innerHTML = debugInfo;
                return;
            }
            
            status.innerHTML = '⏳ Uploading...';
            
            try {
                // Test with the main API endpoint
                console.log('Testing with main API endpoint...');
                const response = await fetch('api/trips', {
                    method: 'POST',
                    body: formData
                });
                
                debugInfo += `<h3>Response:</h3>`;
                debugInfo += `<p><strong>Status:</strong> ${response.status} ${response.statusText}</p>`;
                debugInfo += `<p><strong>Headers:</strong> ${response.headers.get('content-type')}</p>`;
                
                const responseText = await response.text();
                debugInfo += `<p><strong>Raw Response:</strong></p><pre>${responseText}</pre>`;
                
                debug.innerHTML = debugInfo;
                
                if (response.ok) {
                    const result = JSON.parse(responseText);
                    if (result.success) {
                        status.innerHTML = `<span class="success">✅ Upload successful!</span>`;
                        if (result.photo_path) {
                            debugInfo += `<p><strong>Photo saved to:</strong> ${result.photo_path}</p>`;
                            debug.innerHTML = debugInfo;
                        }
                    } else {
                        status.innerHTML = `<span class="error">❌ Upload failed: ${result.message}</span>`;
                    }
                } else {
                    status.innerHTML = `<span class="error">❌ Server error: ${response.status}</span>`;
                }
                
            } catch (error) {
                status.innerHTML = `<span class="error">❌ Network error: ${error.message}</span>`;
                debugInfo += `<p><strong>Error:</strong> ${error.message}</p>`;
                debug.innerHTML = debugInfo;
                console.error('Upload error:', error);
            }
        }
        
        function clearForm() {
            document.getElementById('photo-test-form').reset();
            document.getElementById('preview').style.display = 'none';
            document.getElementById('status').innerHTML = '';
            document.getElementById('debug').innerHTML = '';
        }
    </script>
</body>
</html>
